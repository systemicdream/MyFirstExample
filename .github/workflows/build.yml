name: Build C++

on:
  push:
    branhces: "**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  installL:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -f build-essential g++ cmake
 build:
   needs: install
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v7
     - name: Build project
       run: g++ -std=c++17 main.cpp
